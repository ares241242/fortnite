name: Compte à rebours -> Story Instagram

# Chaque jour vers 17h (Paris, heure d'hiver) : publie une story de compte à rebours
# pour chaque saison/événement de evenements.json, seulement les jours de rappel
# (J-30, J-14, J-7, J-3, J-2, J-1 et le dernier jour).
on:
  schedule:
    - cron: "7 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebours
  cancel-in-progress: false

jobs:
  rebours:
    runs-on: ubuntu-latest
    env:
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Préparer les stories du jour
        id: rebours
        run: |
          python extras.py rebours
          echo "n=$(grep -c . out/rebours/a_publier || true)" >> "$GITHUB_OUTPUT"

      - name: Héberger les images
        if: steps.rebours.outputs.n != '0'
        working-directory: out/rebours
        run: |
          git init -q -b rebours
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Compte à rebours"
          git push -qf "$REMOTE" rebours

      - name: Publier les stories
        if: steps.rebours.outputs.n != '0'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python extras.py post-rebours "https://raw.githubusercontent.com/${{ github.repository }}/rebours"
