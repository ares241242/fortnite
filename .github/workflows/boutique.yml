name: Boutique Fortnite -> Instagram

on:
  schedule:
    # 00h01 UTC = 1 min après le changement de boutique
    # (2h01 en France l'été, 1h01 l'hiver : toujours juste après le reset)
    - cron: "1 0 * * *"
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main
    inputs:
      quoi:
        description: "Que publier ?"
        type: choice
        options: [all, feed, story]
        default: all

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Générer les images de la boutique
        run: python shop.py generate

      # Instagram doit pouvoir télécharger les images depuis une URL publique :
      # on les pousse sur la branche "images" du dépôt (écrasée chaque jour).
      - name: Héberger les images
        working-directory: out
        run: |
          git init -q -b images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Boutique du jour"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" images

      - name: Publier sur Instagram (carrousel + story)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python shop.py post "https://raw.githubusercontent.com/${{ github.repository }}/images" "${{ inputs.quoi || 'all' }}"
